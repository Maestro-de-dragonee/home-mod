name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # Lets you upload the files flat (no folders) - this arranges them for Maven
      - name: Arrange files
        run: |
          mkdir -p src/main/java/com/homes src/main/resources
          [ -f HomesPlugin.java ] && mv HomesPlugin.java src/main/java/com/homes/ || true
          [ -f plugin.yml ] && mv plugin.yml src/main/resources/ || true
          [ -f config.yml ] && mv config.yml src/main/resources/ || true

      - name: Build
        run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: HomesGUI
          path: target/HomesGUI.jar
